* {
  box-sizing: border-box;
}

html,
body {
  min-width: 320px;
  min-height: 100%;
  margin: 0;
}

body {
  min-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 52% -20%, var(--accent-soft), transparent 36%),
    linear-gradient(180deg, color-mix(in srgb, var(--bg-canvas) 94%, var(--accent) 6%), var(--bg-canvas) 32%);
  color: var(--ink);
  font-family: var(--font-ui);
  transition: background var(--base) var(--ease), color var(--base) var(--ease);
}

button,
input,
textarea {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-rows: 52px minmax(0, 1fr);
  min-height: 100vh;
}

.app::before {
  position: fixed;
  inset: 52px 0 0;
  z-index: -1;
  content: "";
  pointer-events: none;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 52px 52px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.4), transparent 74%);
  opacity: .27;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg-canvas) 88%, transparent);
  box-shadow: 0 1px 22px var(--glow-2);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  min-width: max-content;
}

.brand-mark {
  width: 26px;
  height: 18px;
  color: var(--accent);
  filter: drop-shadow(0 0 8px var(--glow-1));
}

.brand-name {
  font: 700 18px/1 var(--font-brand);
  letter-spacing: -.02em;
}

.brand-name em {
  color: var(--accent);
  font-weight: 500;
}

.brand-product {
  padding: 4px 8px 3px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-pill);
  color: var(--ink-3);
  font: 700 9px/1 var(--font-mono);
  letter-spacing: .16em;
}

.topbar-spacer {
  flex: 1;
}

.theme-controls {
  display: flex;
  align-items: center;
  gap: 7px;
}

.theme-button,
.shuffle-button,
.icon-button {
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
  border: 1px solid var(--border);
  background: var(--bg-input);
  cursor: pointer;
  transition: transform var(--fast) var(--ease), border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
}

.theme-button {
  width: 28px;
  height: 28px;
  border-radius: 50%;
}

.theme-button::before {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  content: "";
  background: var(--swatch);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
}

.theme-button[data-theme-choice="pulse"] { --swatch: conic-gradient(from 210deg, #020202, #bf00ff, #050505, #00f0ff, #020202); }
.theme-button[data-theme-choice="slate"] { --swatch: conic-gradient(from 210deg, #142126, #34d399, #1c252a, #38bdf8, #142126); }
.theme-button[data-theme-choice="linen"] { --swatch: conic-gradient(from 210deg, #f1e6d3, #b8732a, #fff9ed, #c65f3d, #f1e6d3); }
.theme-button[data-theme-choice="paper"] { --swatch: conic-gradient(from 210deg, #f6f3e4, #2563eb, #fffef7, #7c3aed, #f6f3e4); }

.theme-button[aria-pressed="true"] {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft), 0 0 14px var(--glow-1);
}

.theme-button:hover,
.shuffle-button:hover,
.icon-button:hover {
  transform: translateY(-1px);
  border-color: var(--accent);
}

.shuffle-button,
.icon-button {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-md);
  color: var(--ink-2);
}

.topbar svg {
  width: 15px;
  height: 15px;
}

.workspace {
  display: grid;
  grid-template-columns: 270px minmax(0, 1fr);
  min-height: 0;
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-width: 0;
  padding: 24px 18px;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg-rail) 91%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.sidebar-heading {
  margin: 0;
  font: 800 10px/1 var(--font-mono);
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.stat {
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: linear-gradient(145deg, var(--bg-surface), var(--bg-input));
}

.stat span {
  display: block;
  margin-bottom: 6px;
  color: var(--ink-3);
  font: 800 8px/1 var(--font-mono);
  letter-spacing: .12em;
  text-transform: uppercase;
}

.stat strong {
  display: block;
  overflow: hidden;
  color: var(--ink);
  font: 800 22px/1 var(--font-brand);
  text-overflow: ellipsis;
}

.side-actions {
  display: grid;
  gap: 8px;
}

.side-button,
.primary-button,
.note-action,
.clear-button {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-input);
  color: var(--ink-2);
  cursor: pointer;
  font: 800 10px/1 var(--font-mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  transition: border-color var(--fast) var(--ease), color var(--fast) var(--ease), background var(--fast) var(--ease), box-shadow var(--fast) var(--ease), transform var(--fast) var(--ease);
}

.side-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 38px;
  padding: 0 12px;
}

.side-button svg {
  width: 14px;
  height: 14px;
}

.side-button:hover,
.primary-button:hover,
.note-action:hover,
.clear-button:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: 0 0 14px var(--glow-2);
}

.shortcut {
  color: var(--ink-4);
  font-size: 8px;
  letter-spacing: .04em;
}

.storage-note {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  color: var(--ink-3);
  font: 600 11px/1.55 var(--font-ui);
}

.storage-note strong {
  display: block;
  margin-bottom: 4px;
  color: var(--ink-2);
  font: 800 9px/1 var(--font-mono);
  letter-spacing: .1em;
  text-transform: uppercase;
}

.main {
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  padding: 28px clamp(18px, 3vw, 44px) 52px;
}

.notes-shell {
  width: min(1440px, 100%);
  margin: 0 auto;
}

.notes-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}

.eyebrow {
  display: block;
  margin-bottom: 7px;
  color: var(--ink-3);
  font: 800 9px/1 var(--font-mono);
  letter-spacing: .14em;
  text-transform: uppercase;
}

.notes-title {
  margin: 0;
  color: var(--ink);
  font: 800 clamp(28px, 3vw, 42px)/.98 var(--font-brand);
  letter-spacing: -.035em;
}

.notes-title em {
  color: var(--accent);
  font-weight: 500;
}

.head-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.primary-button {
  min-height: 38px;
  padding: 0 15px;
  border-color: color-mix(in srgb, var(--accent) 62%, var(--border));
  background: var(--accent-soft);
  color: var(--accent);
}

.search-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  margin-bottom: 10px;
}

.search-wrap {
  position: relative;
}

.search-wrap svg {
  position: absolute;
  top: 50%;
  left: 13px;
  width: 15px;
  height: 15px;
  color: var(--ink-4);
  transform: translateY(-50%);
  pointer-events: none;
}

.note-search {
  width: 100%;
  height: 42px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  outline: 0;
  padding: 0 14px 0 40px;
  background: var(--bg-input);
  color: var(--ink);
  font: 700 12px var(--font-ui);
  transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
}

.note-search::placeholder {
  color: var(--ink-4);
}

.note-search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.clear-button {
  min-width: 70px;
  padding: 0 12px;
}

.clear-button:disabled {
  cursor: default;
  opacity: .38;
}

.notes-status {
  min-height: 16px;
  margin-bottom: 14px;
  color: var(--ink-3);
  font: 800 9px/1 var(--font-mono);
  letter-spacing: .1em;
  text-transform: uppercase;
}

.notes-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: start;
  gap: 14px;
}

.note-card {
  position: relative;
  min-width: 0;
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
  border-radius: var(--radius-lg);
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--bg-surface) 88%, var(--accent) 12%), var(--bg-surface));
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
  overflow: hidden;
  animation: card-in 260ms var(--ease-out) both;
}

.note-card::after {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  content: "";
  pointer-events: none;
  background: linear-gradient(120deg, transparent 52%, var(--accent-soft));
  opacity: .34;
}

.note-card[data-pinned="true"] {
  border-color: color-mix(in srgb, var(--accent) 62%, var(--border));
  box-shadow: var(--shadow), 0 0 22px var(--glow-2), inset 0 1px 0 rgba(255,255,255,.05);
}

.note-card > * {
  position: relative;
  z-index: 1;
}

.note-top {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 44px;
  padding: 10px 10px 8px;
  border-bottom: 1px solid var(--border);
}

.note-pin {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--ink-4);
}

.note-card[data-pinned="true"] .note-pin {
  background: var(--accent);
  box-shadow: 0 0 10px var(--glow-1);
}

.note-meta {
  min-width: 0;
  margin-right: auto;
  overflow: hidden;
  color: var(--ink-3);
  font: 800 8px/1 var(--font-mono);
  letter-spacing: .07em;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

.note-action {
  min-height: 24px;
  padding: 0 7px;
  font-size: 9px;
}

.note-action.is-primary {
  border-color: color-mix(in srgb, var(--accent) 62%, var(--border));
  background: var(--accent-soft);
  color: var(--accent);
}

.note-input {
  display: block;
  width: 100%;
  min-height: 188px;
  max-height: 560px;
  resize: none;
  overflow-y: auto;
  border: 0;
  outline: 0;
  padding: 16px;
  background: transparent;
  color: var(--ink);
  font: 600 14px/1.58 var(--font-ui);
}

.note-input::placeholder {
  color: var(--ink-4);
}

.empty-state {
  grid-column: 1 / -1;
  display: grid;
  place-items: center;
  min-height: 260px;
  padding: 32px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  color: var(--ink-3);
  text-align: center;
}

.empty-state svg {
  width: 30px;
  height: 30px;
  margin-bottom: 12px;
  color: var(--accent);
}

.empty-state strong {
  display: block;
  margin-bottom: 6px;
  color: var(--ink-2);
  font: 800 15px var(--font-ui);
}

.empty-state span {
  font: 600 12px/1.5 var(--font-ui);
}

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 14px;
  max-width: min(360px, calc(100vw - 40px));
  padding: 12px 14px;
  border: 1px solid color-mix(in srgb, var(--accent) 42%, var(--border));
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  color: var(--ink-2);
  box-shadow: var(--shadow), 0 0 20px var(--glow-2);
  font: 700 12px var(--font-ui);
  transform: translateY(18px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--base) var(--ease), transform var(--base) var(--ease);
}

.toast[data-open="true"] {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.toast button {
  margin-left: auto;
  border: 0;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  font: 800 10px var(--font-mono);
  letter-spacing: .08em;
  text-transform: uppercase;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

@keyframes card-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 1120px) {
  .notes-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Compact widget mode: a narrow notepad instead of a compressed dashboard. */

  body {
    overflow: auto;
  }

  .app {
    grid-template-rows: 46px minmax(0, 1fr);

  .notes-list {

  .note-card {

      linear-gradient(135deg, transparent 0 91%, color-mix(in srgb, var(--accent) 24%, transparent) 91% 95%, var(--bg-elevated) 95%);

  .note-card[data-pinned="true"] {

  .note-top {

  .note-action {

  .note-input {

@media (max-width: 780px) {

  .notes-head {

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand" aria-label="MirrorFlow Notes">
      <svg class="brand-mark" viewBox="0 0 40 24" aria-hidden="true">
        <path d="M3 12c5.2-7.2 10.2-7.2 15 0s9.8 7.2 19 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M3 12c5.2 7.2 10.2 7.2 15 0s9.8-7.2 19 0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
      </svg>
      <span class="brand-name">Mirror<em>Flow</em></span>
      <span class="brand-product">NOTES</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="theme-controls" role="radiogroup" aria-label="Theme">
      <button class="theme-button" type="button" data-theme-choice="pulse" aria-label="Pulse theme" title="Pulse - click again to cycle colour" aria-pressed="true"></button>
      <button class="theme-button" type="button" data-theme-choice="slate" aria-label="Slate theme" title="Slate - click again to cycle colour" aria-pressed="false"></button>
      <button class="theme-button" type="button" data-theme-choice="linen" aria-label="Linen theme" title="Linen - click again to cycle colour" aria-pressed="false"></button>
      <button class="theme-button" type="button" data-theme-choice="paper" aria-label="Paper theme" title="Paper - click again to cycle colour" aria-pressed="false"></button>
      <button class="shuffle-button" id="shuffleTheme" type="button" title="Shuffle theme" aria-label="Shuffle theme">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h3.2c4.6 0 4.6 10 9.2 10H20M17 4l3 3-3 3M4 17h3.2c1.7 0 2.8-1.4 3.8-3M17 14l3 3-3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" aria-label="Notes tools">
      <h2 class="sidebar-heading">Library</h2>
      <div class="stats">
        <div class="stat">
          <span>Notes</span>
          <strong id="totalNotes">0</strong>
        </div>
        <div class="stat">
          <span>Pinned</span>
          <strong id="pinnedNotes">0</strong>
        </div>
        <div class="stat">
          <span>Words</span>
          <strong id="totalWords">0</strong>
        </div>
        <div class="stat">
          <span>Saved</span>
          <strong id="savedState">Now</strong>
        </div>
      </div>

      <h2 class="sidebar-heading">Tools</h2>
      <div class="side-actions">
        <button class="side-button" id="sidebarNew" type="button">
          <span>New note</span>
          <span class="shortcut">Ctrl N</span>
        </button>
        <button class="side-button" id="exportNotes" type="button">
          <span>Export notes</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="side-button" id="importNotes" type="button">
          <span>Import notes</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15V3m0 0 4 4m-4-4L8 7M5 17v3h14v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="storage-note">
        <strong>Local and private</strong>
        Notes stay in this browser. Export a backup before clearing browser data.
      </div>
    </aside>

    <main class="main">
      <section class="notes-shell" aria-labelledby="pageTitle">
        <div class="notes-head">
          <div>
            <span class="eyebrow">Persistent workspace</span>
            <h1 class="notes-title" id="pageTitle">Side <em>Notes</em></h1>
          </div>
          <div class="head-actions">
            <button class="primary-button" id="newNote" type="button">New note</button>
          </div>
        </div>

        <div class="search-row">
          <label class="search-wrap">
            <span class="sr-only">Search notes</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <input class="note-search" id="noteSearch" type="search" autocomplete="off" placeholder="Search notes...">
          </label>
          <button class="clear-button" id="clearSearch" type="button" disabled>Clear</button>
        </div>

        <div class="notes-status" id="notesStatus" aria-live="polite">0 notes</div>
        <div class="notes-list" id="notesList"></div>
      </section>
    </main>
  </div>
</div>

<input class="sr-only" id="importFile" type="file" accept="application/json,.json">
<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastText"></span>
  <button id="toastAction" type="button" hidden>Undo</button>
</div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "mf-notes-state-v1";
  const PING_STORAGE_KEY = "mf-ping-state";
  const VARIANTS = Object.freeze({
    pulse: ["electric", "cyber", "acid", "heat", "fuchsia"],
    slate: ["forest", "ocean", "jade", "amber", "orchid"],
    linen: ["harvest", "terracotta", "olive", "plum", "ink"],
    paper: ["sky", "violet", "rose", "mint", "graphite"]
  });

  const html = document.documentElement;
  const notesList = document.getElementById("notesList");
  const noteSearch = document.getElementById("noteSearch");
  const clearSearch = document.getElementById("clearSearch");
  const notesStatus = document.getElementById("notesStatus");
  const totalNotes = document.getElementById("totalNotes");
  const pinnedNotes = document.getElementById("pinnedNotes");
  const totalWords = document.getElementById("totalWords");
  const savedState = document.getElementById("savedState");
  const importFile = document.getElementById("importFile");
  const toast = document.getElementById("toast");
  const toastText = document.getElementById("toastText");
  const toastAction = document.getElementById("toastAction");

  let state = loadState();
  let query = "";
  let saveTimer = 0;
  let toastTimer = 0;
  let lastDeleted = null;
  let lastSavedAt = Date.now();

  function createId() {
    return "note-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function makeNote(text = "", options = {}) {
    const now = Date.now();
    return {
      id: createId(),
      text: String(text),
      pinned: Boolean(options.pinned),
      createdAt: Number(options.createdAt) || now,
      updatedAt: Number(options.updatedAt) || now
    };
  }

  function normalizeNote(note) {
    if (!note || typeof note !== "object") return null;
    const now = Date.now();
    return {
      id: typeof note.id === "string" && note.id ? note.id : createId(),
      text: String(note.text || ""),
      pinned: Boolean(note.pinned),
      createdAt: Number(note.createdAt) || now,
      updatedAt: Number(note.updatedAt) || Number(note.createdAt) || now
    };
  }

  function pingNotes() {
    try {
      const ping = JSON.parse(localStorage.getItem(PING_STORAGE_KEY) || "null");
      if (!ping || !Array.isArray(ping.sideNotes) || !ping.sideNotes.length) return [];
      return ping.sideNotes.map(normalizeNote).filter(Boolean);
    } catch (_) {
      return [];
    }
  }

  function loadState() {
    try {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (stored && Array.isArray(stored.notes)) {
        return {
          version: 1,
          notes: stored.notes.map(normalizeNote).filter(Boolean),
          theme: VARIANTS[stored.theme] ? stored.theme : "pulse",
          variant: VARIANTS[stored.theme]?.includes(stored.variant) ? stored.variant : VARIANTS[stored.theme || "pulse"]?.[0] || "electric"
        };
      }
    } catch (_) {}

    const migrated = pingNotes();
    return {
      version: 1,
      notes: migrated.length ? migrated : [
        makeNote("Reusable copy, customer refs, policy lines, or reminders can live here.")
      ],
      theme: "pulse",
      variant: "electric"
    };
  }

  function scheduleSave() {
    savedState.textContent = "...";
    window.clearTimeout(saveTimer);
    saveTimer = window.setTimeout(saveState, 180);
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      lastSavedAt = Date.now();
      savedState.textContent = "Now";
    } catch (_) {
      savedState.textContent = "Error";
      showToast("Browser storage is unavailable");
    }
  }

  function escapeHTML(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function wordCount(text) {
    const words = String(text || "").trim().match(/\b[\w'-]+\b/g);
    return words ? words.length : 0;
  }

  function relativeTime(timestamp) {
    const seconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
    if (seconds < 10) return "now";
    if (seconds < 60) return seconds + "s";
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + "m";
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + "h";
    return Math.floor(hours / 24) + "d";
  }

  function visibleNotes() {
    const needle = query.trim().toLowerCase();
    return state.notes
      .slice()
      .sort((a, b) => Number(b.pinned) - Number(a.pinned) || b.updatedAt - a.updatedAt)
      .filter(note => !needle || note.text.toLowerCase().includes(needle));
  }

  function updateStats(visibleCount = visibleNotes().length) {
    const total = state.notes.length;
    const pinned = state.notes.filter(note => note.pinned).length;
    const words = state.notes.reduce((sum, note) => sum + wordCount(note.text), 0);
    totalNotes.textContent = String(total);
    pinnedNotes.textContent = String(pinned);
    totalWords.textContent = words > 999 ? (words / 1000).toFixed(1) + "k" : String(words);
    clearSearch.disabled = !query;
    notesStatus.textContent = query
      ? visibleCount + "/" + total + " matches - " + pinned + " pinned"
      : total + " note" + (total === 1 ? "" : "s") + " - " + pinned + " pinned";
  }

  function emptyState() {
    const searching = Boolean(query.trim());
    return `
      <div class="empty-state">
        <div>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 3.5h7l4 4V20.5H7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M14 3.5v4h4M10 12h5M10 15h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <strong>${searching ? "No matching notes" : "No notes yet"}</strong>
          <span>${searching ? "Try another search or clear the filter." : "Create a note and it will save automatically."}</span>
        </div>
      </div>`;
  }

  function render(options = {}) {
    const notes = visibleNotes();
    updateStats(notes.length);
    notesList.innerHTML = notes.length ? notes.map((note, index) => `
      <article class="note-card" data-note-id="${escapeHTML(note.id)}" data-pinned="${note.pinned}" style="animation-delay:${Math.min(index * 28, 168)}ms">
        <div class="note-top">
          <span class="note-pin" aria-hidden="true"></span>
          <span class="note-meta">${wordCount(note.text)}w - ${relativeTime(note.updatedAt)}</span>
          <button class="note-action" type="button" data-action="pin">${note.pinned ? "Pinned" : "Pin"}</button>
          <button class="note-action is-primary" type="button" data-action="copy">Copy</button>
          <button class="note-action" type="button" data-action="duplicate">Dup</button>
          <button class="note-action" type="button" data-action="delete">Del</button>
        </div>
        <textarea class="note-input" spellcheck="true" placeholder="Write a reusable note...">${escapeHTML(note.text)}</textarea>
      </article>
    `).join("") : emptyState();

    notesList.querySelectorAll(".note-input").forEach(autoSize);
    if (options.focusId) {
      const target = notesList.querySelector(`[data-note-id="${CSS.escape(options.focusId)}"] .note-input`);
      if (target) {
        target.focus();
        target.setSelectionRange(target.value.length, target.value.length);
        target.closest(".note-card").scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    }
  }

  function autoSize(textarea) {
    const compact = window.matchMedia("(max-width: 1100px)").matches;
    const minimum = compact ? 86 : 188;
    const maximum = compact ? 220 : 560;
    textarea.style.height = "0px";
    textarea.style.height = Math.min(maximum, Math.max(minimum, textarea.scrollHeight)) + "px";
  }

  function addNote(text = "") {
    const note = makeNote(text);
    state.notes.unshift(note);
    query = "";
    noteSearch.value = "";
    render({ focusId: note.id });
    scheduleSave();
  }

  function duplicateNote(note) {
    const copy = makeNote(note.text, { pinned: false });
    state.notes.unshift(copy);
    render({ focusId: copy.id });
    scheduleSave();
    showToast("Note duplicated");
  }

  async function copyNote(note) {
    if (!note.text.trim()) {
      showToast("Note is empty");
      return;
    }
    try {
      await navigator.clipboard.writeText(note.text);
      showToast("Note copied");
    } catch (_) {
      const fallback = document.createElement("textarea");
      fallback.value = note.text;
      fallback.style.position = "fixed";
      fallback.style.opacity = "0";
      document.body.appendChild(fallback);
      fallback.select();
      const copied = document.execCommand("copy");
      fallback.remove();
      showToast(copied ? "Note copied" : "Copy failed");
    }
  }

  function deleteNote(note) {
    const index = state.notes.findIndex(item => item.id === note.id);
    if (index < 0) return;
    lastDeleted = { note, index };
    state.notes.splice(index, 1);
    render();
    scheduleSave();
    showToast("Note deleted", "Undo", restoreDeleted);
  }

  function restoreDeleted() {
    if (!lastDeleted) return;
    state.notes.splice(Math.min(lastDeleted.index, state.notes.length), 0, lastDeleted.note);
    const restoredId = lastDeleted.note.id;
    lastDeleted = null;
    render({ focusId: restoredId });
    scheduleSave();
    hideToast();
  }

  function showToast(message, actionLabel = "", action = null) {
    window.clearTimeout(toastTimer);
    toastText.textContent = message;
    toastAction.hidden = !actionLabel;
    toastAction.textContent = actionLabel;
    toastAction.onclick = action;
    toast.dataset.open = "true";
    toastTimer = window.setTimeout(hideToast, action ? 6500 : 2400);
  }

  function hideToast() {
    toast.dataset.open = "false";
  }

  function applyTheme(theme, variant, persist = true) {
    const nextTheme = VARIANTS[theme] ? theme : "pulse";
    const nextVariant = VARIANTS[nextTheme].includes(variant) ? variant : VARIANTS[nextTheme][0];
    state.theme = nextTheme;
    state.variant = nextVariant;
    html.dataset.theme = nextTheme;
    html.dataset.variant = nextVariant;
    document.querySelectorAll("[data-theme-choice]").forEach(button => {
      button.setAttribute("aria-pressed", String(button.dataset.themeChoice === nextTheme));
    });
    if (persist) scheduleSave();
  }

  function cycleTheme(theme) {
    const variants = VARIANTS[theme];
    const currentIndex = state.theme === theme ? variants.indexOf(state.variant) : -1;
    applyTheme(theme, variants[(currentIndex + 1) % variants.length]);
    showToast(theme[0].toUpperCase() + theme.slice(1) + " - " + state.variant);
  }

  function shuffleTheme() {
    const themes = Object.keys(VARIANTS);
    const theme = themes[Math.floor(Math.random() * themes.length)];
    const variants = VARIANTS[theme];
    applyTheme(theme, variants[Math.floor(Math.random() * variants.length)]);
    showToast(theme[0].toUpperCase() + theme.slice(1) + " - " + state.variant);
  }

  function exportNotes() {
    const payload = {
      app: "MirrorFlow Notes",
      version: 1,
      exportedAt: new Date().toISOString(),
      notes: state.notes
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "mirrorflow-notes-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1500);
    showToast("Notes exported");
  }

  async function importNotes(file) {
    if (!file) return;
    try {
      const payload = JSON.parse(await file.text());
      const source = Array.isArray(payload) ? payload : payload.notes;
      if (!Array.isArray(source)) throw new Error("Invalid notes file");
      const imported = source.map(normalizeNote).filter(Boolean);
      if (!imported.length) throw new Error("No notes found");
      const existingIds = new Set(state.notes.map(note => note.id));
      imported.forEach(note => {
        if (existingIds.has(note.id)) note.id = createId();
      });
      state.notes = imported.concat(state.notes);
      render();
      scheduleSave();
      showToast(imported.length + " note" + (imported.length === 1 ? "" : "s") + " imported");
    } catch (_) {
      showToast("Import failed - choose a MirrorFlow Notes JSON file");
    } finally {
      importFile.value = "";
    }
  }

  document.getElementById("newNote").addEventListener("click", () => addNote());
  document.getElementById("sidebarNew").addEventListener("click", () => addNote());
  document.getElementById("exportNotes").addEventListener("click", exportNotes);
  document.getElementById("importNotes").addEventListener("click", () => importFile.click());
  document.getElementById("shuffleTheme").addEventListener("click", shuffleTheme);

  importFile.addEventListener("change", () => importNotes(importFile.files[0]));

  document.querySelectorAll("[data-theme-choice]").forEach(button => {
    button.addEventListener("click", () => cycleTheme(button.dataset.themeChoice));
  });

  noteSearch.addEventListener("input", () => {
    query = noteSearch.value;
    render();
  });

  clearSearch.addEventListener("click", () => {
    query = "";
    noteSearch.value = "";
    render();
    noteSearch.focus();
  });

  notesList.addEventListener("input", event => {
    const input = event.target.closest(".note-input");
    if (!input) return;
    const card = input.closest("[data-note-id]");
    const note = state.notes.find(item => item.id === card.dataset.noteId);
    if (!note) return;
    note.text = input.value;
    note.updatedAt = Date.now();
    autoSize(input);
    const meta = card.querySelector(".note-meta");
    if (meta) meta.textContent = wordCount(note.text) + "w - now";
    updateStats();
    scheduleSave();
  });

  notesList.addEventListener("click", event => {
    const actionButton = event.target.closest("[data-action]");
    if (!actionButton) return;
    const card = actionButton.closest("[data-note-id]");
    const note = state.notes.find(item => item.id === card.dataset.noteId);
    if (!note) return;
    const action = actionButton.dataset.action;
    if (action === "pin") {
      note.pinned = !note.pinned;
      note.updatedAt = Date.now();
      render({ focusId: note.id });
      scheduleSave();
      showToast(note.pinned ? "Note pinned" : "Note unpinned");
    } else if (action === "copy") {
      copyNote(note);
    } else if (action === "duplicate") {
      duplicateNote(note);
    } else if (action === "delete") {
      deleteNote(note);
    }
  });

  document.addEventListener("keydown", event => {
    const modifier = event.ctrlKey || event.metaKey;
    if (modifier && event.key.toLowerCase() === "n") {
      event.preventDefault();
      addNote();
    }
    if (modifier && event.key.toLowerCase() === "k") {
      event.preventDefault();
      noteSearch.focus();
      noteSearch.select();
    }
    if (event.key === "Escape" && document.activeElement === noteSearch && query) {
      query = "";
      noteSearch.value = "";
      render();
    }
  });

  window.addEventListener("beforeunload", saveState);

  let resizeFrame = 0;
  window.addEventListener("resize", () => {
    window.cancelAnimationFrame(resizeFrame);
    resizeFrame = window.requestAnimationFrame(() => {
      notesList.querySelectorAll(".note-input").forEach(autoSize);
    });
  });

  window.setInterval(() => {
    const elapsed = Math.floor((Date.now() - lastSavedAt) / 1000);
    savedState.textContent = elapsed < 5 ? "Now" : elapsed < 60 ? elapsed + "s" : Math.floor(elapsed / 60) + "m";
    notesList.querySelectorAll("[data-note-id]").forEach(card => {
      const note = state.notes.find(item => item.id === card.dataset.noteId);
      const meta = card.querySelector(".note-meta");
      if (note && meta && document.activeElement !== card.querySelector(".note-input")) {
        meta.textContent = wordCount(note.text) + "w - " + relativeTime(note.updatedAt);
      }
    });
  }, 5000);

  applyTheme(state.theme, state.variant, false);
  render();
  saveState();
})();
</script>
</body>
</html>
